<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FED // FIELD TERMINAL</title>
    <meta
      name="description"
      content="Federal Bureau of Front-End Development — subject record and case file index."
    />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Caveat:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint so the page never flashes.
      // Dark is the default
      try {
        if (localStorage.getItem('fed-theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- Netlify form detection: parsed at build time so the contact form and its fields are registered. Hidden; the live form is rendered by React and submits to this via fetch. -->
    <form
      name="contact"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="org" />
      <input type="text" name="type" />
      <input type="text" name="priority" />
      <textarea name="statement"></textarea>
      <input type="text" name="attest" />
      <input type="text" name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
